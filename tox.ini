[tox]
requires =
    tox>=4.2
    tox-uv>=1.11
env_list =
    py311-django52
    py{312,313,314}-django{52,60,61}

[testenv]
runner = uv-venv-runner
description = Run tests with {base_python} and {env_name}
package = editable

set_env =
    PGUSER = {env:PGUSER:pbsmmapi}
    PGPASSWORD = {env:PGPASSWORD:pbsmmapi}
    PGDATABASE = {env:PGDATABASE:pbsmmapi}
    PGPORT = {env:PGPORT:55432}
    PGHOST = {env:PGHOST:localhost}
    DJANGO_SETTINGS_MODULE = {env:DJANGO_SETTINGS_MODULE:pbsmmapi.test.settings}
    PBSMM_API_ID = {env:PBSMM_API_ID:test}
    PBSMM_API_SECRET = {env:PBSMM_API_SECRET:test}
    PYTHONWARNINGS = module::DeprecationWarning

pass_env =
    DOCKER_*
    POSTGRES_*
    PG*
    PBSMM_*

dependency_groups =
    dev

deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

commands =
    python ./bin/manage.py test {posargs:--noinput}
